[program:xvfb]
command=/usr/bin/Xvfb :1 -screen 0 1024x768x24 -nolisten tcp
priority=10
autorestart=true
[program:fluxbox]
command=/usr/bin/fluxbox
environment=DISPLAY=":1"
priority=20
autorestart=true
[program:x11vnc]
command=/usr/bin/x11vnc -display :1 -forever -shared -nopw -localhost -quiet
priority=30
autorestart=true
[program:novnc]
command=/usr/bin/websockify --web /usr/share/novnc 6080 localhost:5900
priority=40
autorestart=true
[program:ds9]
command=/opt/ds9/start-ds9.sh
environment=DISPLAY=":1"
priority=50
autorestart=false
startsecs=0
