<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>DS9 Virtual Space Station</title>
<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden;font:14px system-ui,sans-serif}
iframe{border:0;width:100%;height:100%;display:block}
#snd{position:fixed;right:12px;bottom:12px;z-index:9;background:#1f5a2c;color:#d8f5dc;border:1px solid #6fe08a;border-radius:99px;padding:8px 14px;cursor:pointer;opacity:.85}
#snd:hover{opacity:1}
</style></head><body>
<iframe src="vnc.html?autoconnect=1&resize=scale&reconnect=1" allow="clipboard-read; clipboard-write"></iframe>
<button id="snd" type="button">&#128263; Sound off</button>
<script>
// noVNC carries pictures only, so the sound comes as a separate MP3 stream on port 6082.
const btn = document.getElementById('snd'), url = location.protocol + '//' + location.hostname + ':6082/ds9.mp3';
let audio = null, on = false;
function start() {
  audio = new Audio(url + '?t=' + Date.now());
  audio.onerror = audio.onended = () => { if (on) setTimeout(start, 1500); };
  audio.play().catch(() => {});
}
btn.onclick = () => {
  on = !on;
  if (on) { start(); btn.innerHTML = '&#128264; Sound on'; }
  else { if (audio) { audio.onerror = audio.onended = null; audio.pause(); audio.src = ''; } btn.innerHTML = '&#128263; Sound off'; }
};
</script></body></html>
